name: Scrape Jobs

on:
  schedule:
    # Runs daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run job scraper
        run: python scraper/scrape_jobs.py

      - name: Copy jobs data to web
        run: cp scraper/jobs.json web/src/data/jobs.json

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/jobs.json web/src/data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update job listings"
          # Scrape takes >1h, so main can move during the run. Rebase + retry on push race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing on origin/main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "Push failed after 5 attempts"
          exit 1
