name: Scrape Jobs

on:
  schedule:
    # Runs every Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run job scraper
        run: python scraper/scrape_jobs.py

      - name: Copy jobs data to web
        run: cp scraper/jobs.json web/src/data/jobs.json

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/jobs.json web/src/data/jobs.json
          git diff --staged --quiet || git commit -m "Update job listings"
          git push
