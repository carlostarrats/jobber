name: Discover Companies

on:
  schedule:
    # Runs on the 1st of every month at 6am UTC
    - cron: "0 6 1 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run company discovery
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper/discover_companies.py

      - name: Commit updated companies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/companies.json
          git diff --staged --quiet || git commit -m "Update company list"
          git push
